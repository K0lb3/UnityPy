name: Build & Publish wheels
on: workflow_dispatch

jobs:
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build sdist
        run: pipx run build --sdist

      - name: Install sdist
        run: pip install dist/*.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: "sdist"
          path: dist/*.tar.gz

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [build_sdist]
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          lfs: true

      - name: Build wheels
        uses: joerick/cibuildwheel@v4.3
        env:
          CIBW_TEST_SKIP: "*"
          CIBW_SKIP: "pp*"

      - uses: actions/upload-artifact@v7
        with:
          name: "${{ matrix.os }}"
          path: ./wheelhouse/*.whl
          retention-days: 1

  build_linux_wheels:
    name: Build ${{ matrix.libc }} (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: [build_sdist]
    strategy:
      fail-fast: false
      matrix:
        libc: [manylinux, musllinux]
        arch: [x86_64, i686, aarch64, armv7l]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          lfs: true

      - name: Set up QEMU
        if: matrix.arch != 'x86_64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: >-
            ${{
              (matrix.arch == 'i686' && 'linux/386') ||
              (matrix.arch == 'aarch64' && 'linux/arm64') ||
              (matrix.arch == 'armv7l' && 'linux/arm/v7')
            }}

      - name: Build wheels
        uses: joerick/cibuildwheel@v4.3
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_TEST_SKIP: "*"
          CIBW_SKIP: >-
            pp*
            ${{ matrix.libc == 'manylinux' && '*-musllinux*' || '*-manylinux*' }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.libc }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl
          retention-days: 1

  upload_pypi:
    name: Publish to PyPI
    needs: [build_sdist, build_wheels, build_linux_wheels]
    runs-on: ubuntu-latest

    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
